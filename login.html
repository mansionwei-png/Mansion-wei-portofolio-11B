<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Mansion wei</title>
  <meta name="description" content="Halaman masuk." />

  <!-- Fallback mirip Margot (gratis) dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Font Margot: pakai file lokal jika ada (taruh "Margot.woff2" di folder ini),
       jika tidak ada otomatis lanjut ke Sora */
    @font-face {
      font-family: "Margot";
      src: local("Margot"), url("Margot.woff2") format("woff2"), url("Margot.ttf") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --text: #ffffff;
      --muted: #ffffff;
      --radius: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Margot", "Sora", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(1100px 750px at 12% 6%, rgba(200, 20, 20, 0.88), transparent 62%),
        radial-gradient(1100px 750px at 88% 94%, rgba(25, 70, 215, 0.88), transparent 62%),
        linear-gradient(160deg, #2a0404 0%, #12030a 50%, #040313 100%);
      background-attachment: fixed;
      color: var(--text);
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(40, 8, 8, 0.55);
      border: 1px solid rgba(255, 120, 120, 0.25);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      padding: 2.4rem 2rem;
    }

    .avatar-wrap {
      position: relative;
      width: 84px;
      height: 84px;
      margin: 0 auto 1.2rem;
    }

    .avatar-fallback {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #d43a3a, #7a0f0f);
      color: #fff;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    img.avatar {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 0.4rem;
    }

    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 0.35rem 0.3rem;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      margin-bottom: 1.1rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 120, 120, 0.3);
      background: rgba(60, 12, 12, 0.6);
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    input::placeholder { color: rgba(255, 255, 255, 0.45); }

    input:focus {
      border-color: rgba(255, 120, 120, 0.7);
      background: rgba(80, 15, 15, 0.7);
    }

    .btn-masuk {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #d43a3a, #7a0f0f);
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(212, 58, 58, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-masuk:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(212, 58, 58, 0.6);
    }

    .note {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 1.2rem;
    }

    .error {
      text-align: center;
      font-size: 0.85rem;
      color: #ffd7d7;
      background: rgba(255, 80, 80, 0.22);
      border: 1px solid rgba(255, 120, 120, 0.4);
      border-radius: 10px;
      padding: 0.55rem 0.8rem;
      margin-bottom: 1rem;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 1.4rem;
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <!-- Foto profil: simpan gambar sebagai "profile.jpg" di folder yang sama dengan file ini -->
    <div class="avatar-wrap">
      <div class="avatar-fallback">N</div>
      <img class="avatar" src="profile.jpg" alt="Foto Profil" onerror="this.remove()" />
    </div>

    <h1>Selamat datang</h1>
    <p class="sub">Masuk untuk melihat lebih banyak</p>

    <form onsubmit="return handleLogin(event);">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@email.com" required autocomplete="username" />

      <label for="password">Kata Sandi</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />

      <p id="error" class="error" style="display:none;"></p>

      <button type="submit" class="btn-masuk">Masuk</button>
    </form>

    <p class="note">* Halaman demo — akun tersimpan di kode, bukan di server</p>

    <a class="back" href="index.html">&larr; Kembali ke halaman utama</a>
  </main>

  <script>
    // ===== LOGIN DEMO =====
    // Akun demo (karena ini halaman statis, kredensial disimpan di sini)
    var DEMO_EMAIL = "Mansionwei@mutiarabangsa.sch.id";
    var DEMO_PASS  = "Mansionwei555";

    function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById("email").value.trim().toLowerCase();
      var pass  = document.getElementById("password").value;
      var err   = document.getElementById("error");

      if (email === DEMO_EMAIL.toLowerCase() && pass === DEMO_PASS) {
        // Berhasil — tandai sesi demo lalu ke halaman utama
        sessionStorage.setItem("isLoggedIn", "true");
        window.location.href = "index.html";
      } else {
        err.textContent = "Email atau kata sandi salah. Silakan coba lagi.";
        err.style.display = "block";
        document.getElementById("password").value = "";
      }
      return false;
    }
  </script>
</body>
</html>
